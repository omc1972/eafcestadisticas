<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hacce UI · banco de pruebas</title>
    <script>
      // Evita el parpadeo: aplica el modo guardado antes de pintar
      try { var a = localStorage.getItem("hacce-appearance") || "system"; var d = a === "dark" || (a === "system" && matchMedia("(prefers-color-scheme: dark)").matches); document.documentElement.setAttribute("data-theme", d ? "dark" : "light"); if (d) document.documentElement.classList.add("dark") } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
